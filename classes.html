<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSCODE EDU — course list for the term">
  <title>CSCODE EDU — Classes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-classes">
  <header class="site-header">
    <nav class="nav container">
      <a class="logo" href="index.html" aria-label="CSCODE EDU home">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 44 44" fill="none">
            <path d="M6 12.5 C5 7.5 9 4 15 3.5 C24 2.5 34 3 38.5 6 C41.5 8 41 15 41 22 C41 30 41.5 36 38 38.5 C34 41.5 22 41.5 13 40.5 C6.5 39.8 3.5 37 3.5 30 C3.5 24 4 18 6 12.5 Z"
                  fill="url(#lg)" stroke="#3b0764" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M29 15.5 C25 12 17.5 12.5 15.5 18 C13.5 23.5 15.5 30 21.5 30.5 C26 30.9 28.5 28.5 30 26"
                  stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" fill="none"/>
            <defs>
              <linearGradient id="lg" x1="4" y1="4" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                <stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#5b21b6"/>
              </linearGradient>
            </defs>
          </svg>
        </span>
        <span class="logo-word">
          CSCODE EDU
          <svg class="logo-underline" viewBox="0 0 120 10" preserveAspectRatio="none" aria-hidden="true">
            <path d="M2 7 C24 2 46 9 68 4.5 C88 0.8 104 6 118 3" stroke="#7c3aed" stroke-width="2.6"
                  fill="none" stroke-linecap="round"/>
          </svg>
        </span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a class="active" href="classes.html">Classes</a></li>
        <li><a href="updates.html">Updates</a></li>
        <li><a class="nav-cta" href="Enroll.html">Sign Up</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="classes" class="classes-section classes-page">
      <canvas id="balls" class="page-balls" aria-hidden="true"></canvas>
      <div class="container classes-inner">
        <div class="classes-header">
          <h2>My Classes</h2>
          <p class="classes-subtitle">
            Courses I'm enrolled in this term — with schedules, notes, and progress.
          </p>
          <p id="term-label" class="term-badge"></p>
        </div>

        <div class="filter-tabs" role="tablist" aria-label="Filter classes">
          <button class="filter-tab active" role="tab" aria-selected="true" data-filter="all">All</button>
          <button class="filter-tab" role="tab" aria-selected="false" data-filter="STEM">STEM</button>
          <button class="filter-tab" role="tab" aria-selected="false" data-filter="Arts">Arts</button>
        </div>

        <div id="classes-grid" class="classes-grid" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© <span id="year"></span> CSCODE EDU. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
