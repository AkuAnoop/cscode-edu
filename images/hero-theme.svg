<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect width="1200" height="700" fill="url(#glow)"/>

  <!-- floating book -->
  <g opacity="0.9" transform="translate(150,120)">
    <path d="M0 20 C40 0 80 0 120 20 L120 160 C80 140 40 140 0 160 Z" fill="#a78bfa"/>
    <path d="M120 20 C160 0 200 0 240 20 L240 160 C200 140 160 140 120 160 Z" fill="#8b5cf6"/>
    <line x1="120" y1="20" x2="120" y2="160" stroke="#5b21b6" stroke-width="2"/>
  </g>

  <!-- graduation cap -->
  <g transform="translate(820,90)" opacity="0.95">
    <polygon points="90,0 180,35 90,70 0,35" fill="#ede9fe"/>
    <polygon points="90,70 150,50 150,90 90,110 30,90 30,50" fill="#c4b5fd"/>
    <circle cx="180" cy="35" r="4" fill="#4c1d95"/>
    <line x1="180" y1="35" x2="180" y2="80" stroke="#4c1d95" stroke-width="2"/>
  </g>

  <!-- code brackets -->
  <g transform="translate(880,420)" font-family="monospace" font-size="120" fill="#c4b5fd" opacity="0.35">
    <text x="0" y="0">&lt;/&gt;</text>
  </g>

  <!-- circuit / network dots -->
  <g stroke="#c4b5fd" stroke-width="2" opacity="0.4">
    <line x1="100" y1="500" x2="300" y2="450"/>
    <line x1="300" y1="450" x2="450" y2="520"/>
    <line x1="450" y1="520" x2="620" y2="470"/>
  </g>
  <g fill="#ede9fe" opacity="0.7">
    <circle cx="100" cy="500" r="6"/>
    <circle cx="300" cy="450" r="6"/>
    <circle cx="450" cy="520" r="6"/>
    <circle cx="620" cy="470" r="6"/>
  </g>

  <!-- pencil -->
  <g transform="translate(500,560) rotate(-30)" opacity="0.9">
    <rect x="0" y="0" width="140" height="24" rx="4" fill="#ede9fe"/>
    <polygon points="140,0 170,12 140,24" fill="#a78bfa"/>
    <rect x="0" y="0" width="18" height="24" fill="#5b21b6"/>
  </g>
</svg>
